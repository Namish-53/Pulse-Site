<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Namish's Pulse Page</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a, #333333);
      color: #00ff99;
      font-family: 'Courier New', monospace;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ff99;
    }
    #clock {
      font-size: 3.5em;
      font-weight: bold;
      text-shadow: 0 0 20px #00ff99;
      transition: transform 0.3s ease;
      animation: glow 2s infinite;
    }
    #clock:hover {
      transform: scale(1.1);
    }
    #date {
      margin-top: 10px;
      font-size: 1.5em;
      color: #66ffcc;
    }
    .dashboard {
      margin-top: 30px;
    }
    .dashboard a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      background: #00ff99;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s, transform 0.3s;
    }
    .dashboard a:hover {
      background: #66ffcc;
      transform: scale(1.1);
    }
    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9em;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Pulse Page</h1>
  <div id="clock"></div>
  <div id="date"></div>

  <div class="dashboard">
    <a href="https://youtube.com" target="_blank">YouTube</a>
    <a href="https://spotify.com" target="_blank">Spotify</a>
    <a href="https://mail.google.com" target="_blank">Gmail</a>
    <a href="https://github.com" target="_blank">GitHub</a>
  </div>

  <footer>Made by Namish ✨</footer>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      const date = now.toLocaleDateString();
      document.getElementById("clock").innerText = time;
      document.getElementById("date").innerText = date;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
